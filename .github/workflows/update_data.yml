name: Tägliches Marktdaten-Update

on:
  schedule:
    # Läuft börsentäglich (Montag bis Freitag) um 22:30 UTC nach US-Börsenschluss
    - cron: '30 22 * * 1-5'
  workflow_dispatch: # Ermöglicht manuelles Starten über die GitHub-Weboberfläche

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Marktdaten herunterladen und JSON generieren
        run: |
          python scripts/fetch_market_data.py

      - name: Änderungen committen und pushen
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Keine neuen Marktdaten vorhanden."
          else
            git commit -m "Auto-Update Marktdaten: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
