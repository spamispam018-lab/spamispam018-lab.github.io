name: Update Stock Screener Data

on:
  schedule:
    # Mo–Fr um 04:00 UTC (vor Börsenöffnung)
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests pandas numpy

      - name: Screener-Übersicht aktualisieren (falls vorhanden)
        run: |
          if [ -f scripts/fetch_screener.py ]; then
            python scripts/fetch_screener.py
          elif [ -f scripts/update_screener.py ]; then
            python scripts/update_screener.py
          fi

      - name: Detaildaten pro Aktie abrufen
        run: |
          python scripts/fetch_stock_details.py

      - name: Änderungen committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Keine Datenänderungen vorhanden."
          else
            git commit -m "Auto-Update: Stock Data $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
