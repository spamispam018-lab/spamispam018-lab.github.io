name: Update Financial Data

on:
  schedule:
    # Jeden Tag um 06:00 UTC ausführen
    - cron: '0 6 * * *'
  workflow_dispatch: # Manuelles Ausführen ermöglichen

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Finanzdaten aktualisieren
        run: |
          python scripts/fetch_stocks.py

      - name: Änderungen committen und pushen
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatisches Update der Finanzdaten [skip ci]" && git pull --rebase && git push)
