name: Update Financial Data

on:
  schedule:
    # Ausführung jeden Samstag um 03:00 UTC zur vollständigen Wochenaktualisierung
    - cron: '0 3 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Python 3.11 konfigurieren
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Pakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Marktübersicht aktualisieren
        run: |
          python scripts/fetch_stocks.py

      - name: Detaillierte Finanzberichte und Kennzahlen aktualisieren
        run: |
          python scripts/fetch_stock_details.py

      - name: Datensätze committen und synchronisieren
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/
          
          if git diff --staged --quiet; then
            echo "Keine Änderungen an den JSON-Daten festgestellt. Kein Push erforderlich."
          else
            git commit -m "chore(data): wöchentliche Aktualisierung der Finanzkennzahlen [skip ci]"
            git push
          fi
