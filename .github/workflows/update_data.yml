name: Tägliches Marktdaten-Update

on:
  schedule:
    # Börsentäglich um 22:30 UTC
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
    inputs:
      sync_mode:
        description: 'Update-Modus auswählen'
        required: true
        default: 'delta'
        type: choice
        options:
          - delta
          - full
      ticker:
        description: 'Optional: Einzelner Ticker (z.B. AAPL)'
        required: false
        type: string
        default: ''
      only:
        description: 'Optional: Nur bestimmte Daten laden'
        required: false
        default: 'alle'
        type: choice
        options:
          - alle
          - quote
          - analysts
          - insider
          - financials
          - history
          - "analysts,insider"
          - "quote,history"
          - ratios
          - perf

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Marktdaten aktualisieren
        run: |
          MODE="${{ github.event.inputs.sync_mode || 'delta' }}"
          TICKER="${{ github.event.inputs.ticker || '' }}"
          ONLY_CHOICE="${{ github.event.inputs.only || 'alle' }}"
          
          echo "Starte Modus: $MODE"
          
          ARGS="--mode $MODE"
          
          if [ -n "$TICKER" ]; then
            echo "Aktualisiere einzelnen Ticker: $TICKER"
            ARGS="$ARGS --ticker $TICKER"
          fi
          
          # Wenn nicht "alle" ausgewählt wurde, Parameter anhängen
          if [ "$ONLY_CHOICE" != "alle" ]; then
            echo "Beschränke auf Sektionen: $ONLY_CHOICE"
            ARGS="$ARGS --only \"$ONLY_CHOICE\""
          fi
          
          python scripts/fetch_market_data.py $ARGS

      # Kaputte Daten (fehlende Ticker, ungültiges JSON, plötzlich viel weniger Werte) nicht committen
      - name: Daten prüfen
        run: python scripts/validate_data.py

      - name: Änderungen committen und pushen
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Keine neuen Marktdaten vorhanden."
          else
            git commit -m "Auto-Update Marktdaten (${{ github.event.inputs.sync_mode || 'delta' }}): $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin main
          fi