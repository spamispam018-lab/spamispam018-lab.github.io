name: Nachrichten-Update

on:
  schedule:
    - cron: '15 6,12,17 * * 1-5'
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: FinBERT-Modell cachen
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: finbert-v1
      - name: Abhängigkeiten installieren
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers yfinance pandas
      - name: Nachrichten holen und bewerten
        run: python scripts/fetch_news.py
      # Kaputte Daten (fehlende Ticker, ungültiges JSON, plötzlich viel weniger Werte) nicht committen
      - name: Daten prüfen
        run: python scripts/validate_data.py

      - name: Committen und pushen
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news/
          if git diff --staged --quiet; then
            echo "Keine neuen Nachrichten."
          else
            git commit -m "Auto-Update Nachrichten: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin main
          fi