name: Deutsche Ticker ermitteln

on:
  schedule:
    # Wöchentlich sonntags um 06:00 UTC (arbeitet pro Lauf einen Teil der Ticker ab)
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      max:
        description: 'Maximal neu bearbeitete Ticker pro Lauf'
        required: false
        default: '150'
        type: string
      ticker:
        description: 'Optional: Einzelner Ticker (z.B. NVDA)'
        required: false
        default: ''
        type: string

jobs:
  de-symbols:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yfinance pandas

      - name: Deutsche Symbole ermitteln
        run: |
          ARGS="--max ${{ github.event.inputs.max || '150' }}"
          TICKER="${{ github.event.inputs.ticker || '' }}"
          if [ -n "$TICKER" ]; then ARGS="$ARGS --ticker $TICKER"; fi
          python scripts/build_de_symbols.py $ARGS

      - name: Änderungen committen und pushen
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/de_symbols.json
          if git diff --staged --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Deutsche Ticker aktualisiert: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin main
          fi
