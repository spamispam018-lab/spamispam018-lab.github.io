name: Update Stock Data

on:
  schedule:
    # Täglich montags bis freitags um 20:00 Uhr UTC ausführen
    - cron: '0 20 * * 1-5'
  workflow_dispatch: # Ermöglicht manuelles Starten unter "Actions"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests

      - name: Ensure data directories exist
        run: |
          mkdir -p data/details

      - name: Run Fetch Stocks Script
        run: |
          python scripts/fetch_stocks.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Keine neuen Datenänderungen vorhanden."
          else
            git commit -m "Automated update: Stock market data [skip ci]"
            git push
          fi
