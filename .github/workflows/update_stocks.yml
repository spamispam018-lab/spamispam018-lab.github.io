name: Tägliche Aktualisierung der Aktiendaten

on:
  schedule:
    # Läuft börsentäglich (Montag bis Freitag) um 22:30 UTC nach US-Börsenschluss
    - cron: '30 22 * * 1-5'
  workflow_dispatch: # Ermöglicht den manuellen Start über die GitHub-Oberfläche

permissions:
  contents: write

jobs:
  update-stock-data:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install yfinance

      - name: Marktdaten abrufen & JSON generieren
        run: |
          python scripts/fetch_stocks.py

      - name: Datenänderungen committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automatische Aktualisierung der Aktiendaten [skip ci]" && git push)
