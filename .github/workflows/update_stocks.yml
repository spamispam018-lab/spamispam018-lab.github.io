name: Update Stock Details

on:
  schedule:
    # Jeden Tag um 07:00 UTC ausführen (nach fetch_stocks)
    - cron: '0 7 * * *'
  workflow_dispatch: # Manuelles Ausführen ermöglichen

permissions:
  contents: write

jobs:
  update-stock-details:
    runs-on: ubuntu-latest
    
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Detaildaten aktualisieren
        run: |
          python scripts/fetch_stock_details.py

      - name: Änderungen committen und pushen
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatisches Update der Detaildaten [skip ci]" && git pull --rebase && git push)
