name: Update Stock Data

on:
  schedule:
    # Ausführung börsentäglich von Montag bis Freitag um 22:00 UTC (nach US-Börsenschluss)
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # Ermöglicht manuelles Triggern im GitHub Actions Tab

permissions:
  contents: write

jobs:
  update-stocks:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Kurs- und Übersichtsdaten abrufen
        run: |
          python scripts/fetch_stocks.py

      - name: Detail- und Finanzdaten abrufen
        run: |
          python scripts/fetch_stock_details.py

      - name: Änderungen committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Alle Änderungen im data-Verzeichnis stagen
          git add data/
          
          # Prüfen, ob geänderte Dateien vorliegen
          if git diff --staged --quiet; then
            echo "Keine neuen Datenänderungen vorhanden. Commit übersprungen."
          else
            git commit -m "chore(data): automatische Aktualisierung der Aktiendaten [skip ci]"
            git push
          fi
