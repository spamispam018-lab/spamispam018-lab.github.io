name: Treiber & Termine aktualisieren

on:
  schedule:
    # Täglich 05:41 und 15:41 UTC (morgens vor Xetra-Start, nachmittags vor US-Eröffnung)
    - cron: '41 5,15 * * *'
  workflow_dispatch:

concurrency:
  group: catalysts
  cancel-in-progress: false

jobs:
  catalysts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Nachrichten sammeln und einordnen
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/fetch_catalysts.py

      - name: Daten prüfen
        run: python scripts/validate_data.py

      - name: Änderungen committen und pushen
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/catalysts.json
          if git diff --staged --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Treiber & Termine aktualisiert: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin main
          fi
