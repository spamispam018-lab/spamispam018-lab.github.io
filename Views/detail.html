<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weiterleitung zur Aktienansicht</title>
  <script>
    // Leitet Aufrufe der alten detail.html automatisch auf die neue modulare stock.html weiter
    (function() {
      var params = window.location.search || "";
      window.location.replace("stock.html" + params);
    })();
  </script>
</head>
<body style="background-color: #0e1117; color: #8b949e; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
  <p>Leite zur Aktien-Detailansicht weiter... <a href="stock.html" style="color: #388bfd;">Hier klicken</a>, falls die Weiterleitung nicht automatisch erfolgt.</p>
</body>
</html>
