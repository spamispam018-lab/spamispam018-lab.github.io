<!-- Views/screener.html -->
<div class="space-y-4">

  <!-- Kennzahlen-Karte / Marktübersicht -->
  <div class="relative overflow-hidden rounded-2xl p-5 bg-gradient-to-br from-blue-600 via-indigo-600 to-violet-700 shadow-xl shadow-indigo-950/40 border border-white/10 text-white">
    <div class="text-[11px] font-semibold tracking-wider uppercase opacity-80 mb-1">
      Marktübersicht (Aktienuniversum)
    </div>
    
    <div id="totalStocksCount" class="text-3xl font-extrabold tracking-tight mb-4">
      0 Titel
    </div>

    <div class="grid grid-cols-3 gap-2 pt-3 border-t border-white/15 text-xs">
      <div>
        <div class="text-white/70 text-[11px]">Top-Gewinner</div>
        <div id="topGainer" class="font-bold text-emerald-300 truncate mt-0.5">-</div>
      </div>
      <div>
        <div class="text-white/70 text-[11px]">Ø KGV</div>
        <div id="avgPe" class="font-bold text-white mt-0.5">-</div>
      </div>
      <div>
        <div class="text-white/70 text-[11px]">Ø Div.-Rendite</div>
        <div id="avgDiv" class="font-bold text-white mt-0.5">-</div>
      </div>
    </div>
  </div>

  <!-- Sucheingabe -->
  <div class="relative">
    <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
    <input 
      type="text" 
      id="searchInput"
      placeholder="Name oder Ticker suchen..." 
      class="w-full bg-[#131b2e] border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors"
    >
  </div>

  <!-- Schnellfilter Chips -->
  <div class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar text-xs">
    <button 
      id="chipDividend"
      onclick="FilterService.toggleFilterChip('dividend'); updateChipStyles(); AppUI.renderStockList();"
      class="chip-btn px-3 py-1.5 rounded-full border border-slate-800 bg-slate-900/60 text-slate-300 font-medium whitespace-nowrap hover:border-slate-700 transition"
    >
      Dividende
    </button>
    <button 
      id="chipValue"
      onclick="FilterService.toggleFilterChip('value'); updateChipStyles(); AppUI.renderStockList();"
      class="chip-btn px-3 py-1.5 rounded-full border border-slate-800 bg-slate-900/60 text-slate-300 font-medium whitespace-nowrap hover:border-slate-700 transition"
    >
      💎 Value (KGV &lt; 18)
    </button>
    <button 
      id="chipGrowth"
      onclick="FilterService.toggleFilterChip('growth'); updateChipStyles(); AppUI.renderStockList();"
      class="chip-btn px-3 py-1.5 rounded-full border border-slate-800 bg-slate-900/60 text-slate-300 font-medium whitespace-nowrap hover:border-slate-700 transition"
    >
      🚀 Growth
    </button>
  </div>

  <!-- Ergebnisse & Sortierung -->
  <div class="flex items-center justify-between text-xs text-slate-400 pt-1">
    <div id="resultCount" class="font-medium">0 Ergebnisse</div>
    <div class="flex items-center gap-1.5">
      <select 
        id="sortSelect" 
        class="bg-[#131b2e] border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-blue-500"
      >
        <option value="marketCap_desc">Marktkapitalisierung (Höchste)</option>
        <option value="marketCap_asc">Marktkapitalisierung (Niedrigste)</option>
        <option value="pe_asc">KGV (Niedrigstes zuerst)</option>
        <option value="pe_desc">KGV (Höchstes zuerst)</option>
        <option value="change_desc">Performance (Beste zuerst)</option>
        <option value="change_asc">Performance (Schlechteste)</option>
        <option value="dividend_desc">Dividendenrendite</option>
      </select>
    </div>
  </div>

  <!-- Aktienliste -->
  <div id="stockList" class="space-y-3 pt-1">
    <!-- Wird dynamisch durch AppUI.renderStockList() befüllt -->
  </div>

</div>

<script>
  function updateChipStyles() {
    const activeChip = FilterService.activeFilterChip;
    const chips = {
      'dividend': document.getElementById('chipDividend'),
      'value': document.getElementById('chipValue'),
      'growth': document.getElementById('chipGrowth')
    };

    Object.keys(chips).forEach(key => {
      const el = chips[key];
      if (!el) return;
      if (activeChip === key) {
        el.classList.add('bg-blue-600/20', 'border-blue-500', 'text-blue-400');
        el.classList.remove('bg-slate-900/60', 'border-slate-800', 'text-slate-300');
      } else {
        el.classList.remove('bg-blue-600/20', 'border-blue-500', 'text-blue-400');
        el.classList.add('bg-slate-900/60', 'border-slate-800', 'text-slate-300');
      }
    });
  }
</script>
