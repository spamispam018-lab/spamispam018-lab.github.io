<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Aktien Screener &amp; Analyse</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Aktien">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script>
    (function () {
      try {
        var stored = localStorage.getItem('app_theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="app-header">
    <button id="btn-header-back" class="icon-btn" aria-label="Zurück" style="display:none;margin-right:10px;flex-shrink:0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="header-title-group" style="flex:1;min-width:0;">
      <div id="app-header-title" class="header-title">Entdecken</div>
      <div id="app-header-subtitle" class="header-subtitle">Aktien filtern &amp; finden</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button id="pwa-install-btn" class="icon-btn" aria-label="App installieren" style="display:none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>
        </svg>
      </button>
      <button id="btn-cmdk-open" class="icon-btn" aria-label="Suche öffnen (Cmd+K)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
      <button id="btn-app-menu" class="icon-btn" aria-label="Einstellungen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
      </button>
    </div>
  </header>

  <div id="app-segbar" style="display:none;"></div>
  <main id="app-view-content"></main>

  <nav class="bottom-nav">
    <a href="#/market" class="nav-item" data-group="markt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="8" height="8" rx="1"></rect><rect x="13" y="3" width="8" height="5" rx="1"></rect><rect x="13" y="10" width="8" height="11" rx="1"></rect><rect x="3" y="13" width="8" height="8" rx="1"></rect></svg>
      <span>Markt</span>
    </a>
    <a href="#/screener" class="nav-item active" data-group="entdecken">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>
      <span>Entdecken</span>
    </a>
    <a href="#/watchlist" class="nav-item" data-group="watchlist">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
      <span>Watchlist</span>
    </a>
    <a href="#/portfolio" class="nav-item" data-group="depot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="7" width="20" height="14" rx="2"></rect><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"></path></svg>
      <span>Depot</span>
    </a>
  </nav>
