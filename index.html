<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aktien-Screener & Analyse</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bgDark: '#0b0f19',
            cardDark: '#131b2e',
            borderDark: '#1e293b',
            brandBlue: '#3b82f6',
            brandPurple: '#8b5cf6',
            brandGreen: '#10b981',
            brandRed: '#ef4444'
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/stock.css">
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex flex-col font-sans antialiased pb-24">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-[#0b0f19]/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/20">
          <i data-lucide="trending-up" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white leading-tight">Aktien-Screener</h1>
          <p class="text-xs text-slate-400">Live-Marktdaten synchronisiert</p>
        </div>
      </div>
      <button id="themeToggleBtn" class="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800/60 transition-colors">
        <i data-lucide="sliders-horizontal" class="w-5 h-5"></i>
      </button>
    </div>
  </header>

  <!-- Haupt-Container für Views -->
  <main id="app" class="flex-1 max-w-7xl w-full mx-auto px-4 py-4">
    <!-- View-Container (screener, detail, watchlist) -->
    <div id="viewContainer"></div>
  </main>

  <!-- Bottom Navigation (Mobile & Desktop App-Style) -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-[#0d1424]/95 backdrop-blur-lg border-t border-slate-800/80 py-2">
    <div class="max-w-md mx-auto grid grid-cols-2 gap-2 px-6">
      <button id="navScreenerBtn" onclick="Navigation.navigate('screener')" class="flex flex-col items-center justify-center py-1 rounded-xl text-blue-500 transition-colors">
        <i data-lucide="filter" class="w-5 h-5 mb-1"></i>
        <span class="text-xs font-medium">Screener</span>
      </button>
      <button id="navWatchlistBtn" onclick="Navigation.navigate('watchlist')" class="flex flex-col items-center justify-center py-1 rounded-xl text-slate-400 hover:text-slate-200 transition-colors">
        <i data-lucide="star" class="w-5 h-5 mb-1"></i>
        <span class="text-xs font-medium">Watchlist</span>
      </button>
    </div>
  </nav>

  <!-- Externe Bibliotheken -->
  <script src="js/lib/chart.umd.js"></script>

  <!-- 1. Fallback-Daten zuerst laden -->
  <script src="data/fallback-data.js"></script>

  <!-- 2. Services & Konfigurationen -->
  <script src="js/score-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/watchlist.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/charts.js"></script>

  <!-- 3. Stock Detail Module -->
  <script src="js/stock-data.js"></script>
  <script src="js/stock-score.js"></script>
  <script src="js/stock-charts.js"></script>
  <script src="js/stock-overview.js"></script>
  <script src="js/stock-financials.js"></script>
  <script src="js/stock-statements.js"></script>
  <script src="js/stock-holdings.js"></script>
  <script src="js/stock-analyst.js"></script>
  <script src="js/stock-compare.js"></script>
  <script src="js/stock-nav.js"></script>

  <!-- 4. App UI Controller & Initialisierung -->
  <script src="js/ui.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
